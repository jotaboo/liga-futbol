<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD Castrelos - Ficha Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cb-dark: #121212;
            --cb-card: #1E1E1E;
            --cb-gray: #E5E8EB;
            --cb-white: #FFFFFF;
            --castrelos-green: #1E3F20;
            --castrelos-blue: #1B2A4A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        img, svg {
            max-width: 100% !important;
            height: auto !important;
            display: inline-block;
            vertical-align: middle;
        }

        body {
            background-color: var(--cb-dark);
            color: var(--cb-gray);
            font-size: 13px;
            line-height: 1.4;
        }

        header {
            background: linear-gradient(135deg, var(--castrelos-green) 0%, var(--castrelos-blue) 100%);
            border-bottom: 3px solid #E2E5E8;
            padding: 20px 15px;
            text-align: center;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .team-crest-wrapper {
            width: 55px !important;
            height: 55px !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header h1 {
            color: var(--cb-white);
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        nav {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #2a2a2a;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        nav a:hover {
            background-color: var(--castrelos-green);
            color: var(--cb-white);
        }

        .container {
            max-width: 1000px;
            margin: 15px auto;
            padding: 0 10px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .card {
            background: var(--cb-card);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
        }

        h2 {
            color: var(--cb-white);
            font-size: 0.95rem;
            margin-bottom: 10px;
            border-left: 3px solid var(--castrelos-green);
            padding-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .city-photo {
            width: 100%;
            height: 190px;
            object-fit: cover;
            object-position: center;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }

        .club-info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .info-box {
            background: #161616;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 2px solid var(--castrelos-green);
        }

        .info-box span {
            display: block;
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }

        .info-box strong {
            font-size: 0.85rem;
            color: var(--cb-white);
        }

        .history-timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .timeline-item {
            background: #161616;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--castrelos-green);
        }

        .timeline-item strong {
            color: var(--cb-white);
            font-size: 0.85rem;
            display: block;
            margin-bottom: 3px;
        }

        .timeline-item p {
            font-size: 0.8rem;
            color: #ccc;
            text-align: justify;
        }

        .kits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }

        .kit-card {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 8px;
        }

        .kit-card img {
            max-height: 120px !important;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .kit-card span {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--cb-white);
            display: block;
        }

        table.history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        table.history-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #2a2a2a;
        }

        table.history-table td:nth-child(odd) {
            color: #aaa;
        }

        table.history-table td:nth-child(even) {
            color: var(--cb-white);
            font-weight: 600;
            text-align: right;
        }

        .sponsor-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161616;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 2px solid var(--castrelos-green);
        }

        .sponsor-logo-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sponsor-logo-name img {
            max-height: 24px !important;
            width: auto !important;
            object-fit: contain;
        }

        .sponsor-info span {
            display: block;
            font-size: 0.68rem;
            color: #888;
            text-transform: uppercase;
        }

        .sponsor-info strong {
            font-size: 0.82rem;
            color: var(--cb-white);
        }

        .sponsor-amount {
            color: #7ce38b;
            font-weight: 700;
            font-size: 0.82rem;
        }

        .position-group {
            margin-bottom: 12px;
        }

        .position-title {
            font-size: 0.8rem;
            color: #7ce38b;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 3px;
        }

        .player-list {
            list-style: none;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #222;
            font-size: 0.82rem;
        }

        .player-item:hover {
            background: #252525;
            border-radius: 4px;
        }

        .player-num {
            color: #888;
            font-weight: 700;
            margin-right: 8px;
            width: 20px;
        }

        .player-name {
            color: var(--cb-white);
            font-weight: 600;
            flex-grow: 1;
        }

        .palmares-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid #222;
            font-size: 0.82rem;
            color: var(--cb-white);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .kits-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            </div>
            <div>
                <h1>Club Deportivo Castrelos</h1>
                <p>Fundado en 1945 • "Los Canteros / La Marea Verde"</p>
            </div>
        </div>
    </header>

    <nav>
        <a href="../index.html">← Volver a la Liga</a>
        <a href="#historia">Historia</a>
        <a href="#equipaciones">Equipaciones</a>
        <a href="#estadio">Estadio & Ciudad</a>
        <a href="#presidente">Presidencia</a>
        <a href="#patrocinadores">Patrocinio</a>
        <a href="#clasificacion-historica">Historial 1ª Div</a>
        <a href="#masasocial">Masa Social</a>
        <a href="#plantilla">Plantilla (25)</a>
    </nav>

        <main>
            <section id="historia" class="card">
                <h2>Historia y Evolución del Club</h2>
